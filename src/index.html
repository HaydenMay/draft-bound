<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Draft Bound</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Roll real-player potential, develop your wide receiver through college, get drafted, and collect the story. Play Draft Bound free in your browser.">
  <meta name="theme-color" content="#17211e">
  <script data-theme-bootstrap>
    (() => {
      let preference = 'system';
      document.documentElement.dataset.palette = 'forest';
      try { const palette=localStorage.getItem('draft-bound-palette'); document.documentElement.dataset.palette=["forest","copper","navy","charcoal","teal","midnight-blues","burgundy-bronze","champion-royale","deep-sea","rustic-charm","dark-sunset","coastal-vibes","vintage-sunset","summit-ice","cobalt-crown","garnet-legacy"].includes(palette)?palette:'forest'; } catch {}
      try { preference = localStorage.getItem('draft-bound-theme') || 'system'; } catch {}
      document.documentElement.dataset.theme = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body><app-root></app-root></body>
</html>
